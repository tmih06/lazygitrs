name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.0.38)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Gate: tag must point at a commit on main, and the tree must pass tests.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
      - name: Resolve + validate tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Expected a tag like v0.0.38, got: $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "Tag $RELEASE_TAG points to a commit that is not on main"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: cargo test
        run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  asset: lazygitrs-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: lazygitrs-linux-aarch64 }
          - { os: macos-14,       target: aarch64-apple-darwin,     asset: lazygitrs-macos-aarch64 }
          # macos-13 Intel runners are deprecated/slow — cross-compile x86_64 on ARM.
          - { os: macos-14,       target: x86_64-apple-darwin,      asset: lazygitrs-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   asset: lazygitrs-windows-x86_64.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc,  asset: lazygitrs-windows-aarch64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: release
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/lazygitrs"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}" || true
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" >> ../checksums.txt
          else
            shasum -a 256 "${{ matrix.asset }}" >> ../checksums.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            checksums.txt
          retention-days: 1

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Merge checksums + stage installers
        shell: bash
        run: |
          set -euo pipefail
          cat dist/checksums.txt | sort -u > checksums.txt
          cp install.sh dist/lazygitrs-installer.sh
          cp install.ps1 dist/lazygitrs-installer.ps1
          mv checksums.txt dist/
          ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: lazygitrs ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          files: dist/*
